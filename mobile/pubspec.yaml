name: ekyc_wallet
description: "eKYC Mobile app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  http: ^1.1.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  path_provider: ^2.1.1
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/zk/index.html
    - assets/zk/snarkjs.min.js
    - assets/zk/requirements_check.wasm
    - assets/zk/requirements_check_final.zkey
  uses-material-design: true
