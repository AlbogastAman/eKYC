test:
  name: eKYC-Benchmark
  description: Performance and scalability benchmark for eKYC smart contract with safe concurrency

  workers:
    type: local
    number: 5  # total parallel workers

  options:
    test:
      transactionFailureThreshold: 5  # fail if <95% success
    monitoring:
      interval: 1

  rounds:
    # ---------------------------------------------------
    # Phase 0 – Dataset Preload (10k Anchors, split into small batches)
    # ---------------------------------------------------
    - label: preload-batch1
      description: Populate ledger with first 250 anchored credentials
      txNumber: 250
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/anchorCredential.js

    - label: preload-batch2
      description: Next 250 anchored credentials
      txNumber: 250
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/anchorCredential.js

    - label: preload-batch3
      description: Next 250 anchored credentials
      txNumber: 250
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/anchorCredential.js

    - label: preload-batch4
      description: Next 250 anchored credentials
      txNumber: 250
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/anchorCredential.js

    # Repeat batches until reaching total 10k (40 batches of 250)

    # ---------------------------------------------------
    # Phase 1 – Warmup (Stabilize Network)
    # ---------------------------------------------------
    - label: warmup
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/anchorCredential.js

    # ---------------------------------------------------
    # Phase 2 – Pure Write Performance (Anchor Only)
    # ---------------------------------------------------
    - label: anchor-write
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 40
      workload:
        module: workloads/anchorCredential.js

    # ---------------------------------------------------
    # Phase 3 – Composite Write Performance (Approve)
    # ---------------------------------------------------
    - label: approve-write
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 40
      workload:
        module: workloads/approve.js

    # ---------------------------------------------------
    # Phase 4 – Read Performance (Anchor Retrieval)
    # ---------------------------------------------------
    - label: read-anchor
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: workloads/readAnchor.js

    # ---------------------------------------------------
    # Phase 5 – Relation Query Scalability
    # ---------------------------------------------------
    - label: relation-query
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: workloads/getRelationByFi.js

    # ---------------------------------------------------
    # Phase 6 – Realistic Production Mix
    # ---------------------------------------------------
    - label: mixed-production
      txDuration: 180
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: workloads/mixedWorkload.js

    # ---------------------------------------------------
    # Phase 7 – Progressive Stress Ramp (safe bursts)
    # ---------------------------------------------------
    - label: stress-150
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: workloads/mixedWorkload.js

    - label: stress-200
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 80
      workload:
        module: workloads/mixedWorkload.js

    - label: stress-250
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workloads/mixedWorkload.js