test:
  name: eKYC-Multi-Org-Handoff-Benchmark
  description: Testing FI1 Creation, FI1 Approval, and FI2 Authorized Access

  workers:
    type: local
    number: 3 # Maximizes 2 CPUs without overloading the RAM

    options:
    test:
      transactionFailureThreshold: 5 # Tighter tolerance for better data
    monitoring:
      type: ["docker"]
      docker:
        containers: ["peer0.org1.example.com", "couchdb0"] # Monitor only key bottlenecks
      interval: 2 # Reduced frequency to save CPU cycles

  rounds:
    # --- STEP 1: FI1 Identity Creation ---
    - label: "Step-1-FI1-Creation"
      txNumber: 1500
      rateControl:
        type: fixed-rate
        opts: { tps: 10 } # Stable baseline for 4GB RAM
      workload:
        module: workloads/createClient.js
        arguments:
          seed: "FINAL_01"
          totalAssets: 1500

    # --- STEP 2: Database Settling (Cooldown) ---
    - label: "Cooldown-Sync"
      txDuration: 30
      rateControl: { type: fixed-rate, opts: { tps: 1 } }
      workload:
        module: workloads/readAnchor.js
        arguments: { seed: "FINAL_01", totalAssets: 1500 }

    # --- STEP 3: FI1 Grants Access to FI2 ---
    - label: "Step-2-FI1-Approve-FI2"
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts: { tps: 8 } # Read-Modify-Write is heavier on CPU
      workload:
        module: workloads/approve.js
        arguments:
          seed: "FINAL_01"
          totalAssets: 1500

    # --- STEP 4: FI2 Authorized Data Retrieval ---
    - label: "Step-3-FI2-Get-Data"
      txDuration: 120
      rateControl:
        type: linear-rate
        opts:
          startingTps: 10
          finishingTps: 50 # Stress test the read-only capability
      workload:
        module: workloads/getClientData.js
        arguments:
          seed: "FINAL_01"
          totalAssets: 1500
          invoker: "_Org2MSP_FI2"
