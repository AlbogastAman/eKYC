test:
  name: eKYC-Hyperledger-fabric-benchmark
  description: Optimized for 2CPU/4GB RAM environment
  
  workers:
    type: local
    number: 3 # Optimal for 2 CPUs

  options:
    test:
      transactionFailureThreshold: 5 # Tighter tolerance for better data
    monitoring:
      type: ["docker"]
      docker:
        containers: ["peer0.org1.example.com", "couchdb0"] # Monitor only key bottlenecks
      interval: 2 # Reduced frequency to save CPU cycles

  rounds:
    # --- Step 1: Managed Preload (Part A) ---
    - label: preload-part-1
      txNumber: 5000
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/createClient.js
        arguments: { seed: "FINAL_01", totalAssets: 10000 }

    # --- Step 2: Intermediate Indexing Breath ---
    - label: mid-cooldown
      txDuration: 45 # Longer pause for small RAM
      rateControl: { type: fixed-rate, opts: { tps: 1 } }
      workload: { module: workloads/readAnchor.js, arguments: { seed: "FINAL_01", totalAssets: 10000 } }

    # --- Step 3: Managed Preload (Part B) ---
    - label: preload-part-2
      txNumber: 5000
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/createClient.js
        arguments: { seed: "FINAL_01", totalAssets: 10000 }

    # --- Step 4: Warm Read Stress ---
    - label: read-performance
      txDuration: 60
      rateControl:
        type: linear-rate
        opts:
          startingTps: 20
          finishingTps: 100 # Find where reads saturate the 2 CPUs
      workload:
        module: workloads/readAnchor.js
        arguments: { seed: "FINAL_01", totalAssets: 10000 }

    # --- Step 5: Realistic Mixed Stress ---
    - label: mixed-stress-ramp
      txDuration: 180
      rateControl:
        type: linear-rate
        opts:
          startingTps: 10
          finishingTps: 50 # 50 TPS is very realistic for this hardware
      workload:
        module: workloads/mixedWorkload.js
        arguments: { seed: "FINAL_01", totalAssets: 10000 }