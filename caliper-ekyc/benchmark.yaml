test:
  name: eKYC-Benchmark
  description: Testing Client Creation,FI Approval, and Authorized Access to KYC data

  workers:
    type: local
    number: 3 # Maximizes 2 CPUs without overloading the RAM

    options:
    test:
      transactionFailureThreshold: 5 # Tighter tolerance for better data
    monitoring:
      type: ["docker"]
      docker:
        containers: [
            "peer0.org1.example.com",
            "peer0.org2.example.com",
            "orderer.example.com",
            "couchdb0",
            "couchdb1",
          ] # Monitor only key bottlenecks
      interval: 2 # Reduced frequency to save CPU cycles

  rounds:
    # --- STEP 1: FI1 Client Creation ---
    - label: "Step 1: Client Creation"
      txNumber: 1500
      rateControl:
        type: fixed-rate
        opts: { tps: 10 } # Stable baseline for 4GB RAM
      workload:
        module: workloads/createClient.js
        arguments:
          seed: "FINAL_01"
          totalAssets: 1500

    # --- STEP 2: Database Settling (Cooldown) ---
    - label: "Cooldown-Sync"
      txDuration: 30
      rateControl: { type: fixed-rate, opts: { tps: 1 } }
      workload:
        module: workloads/readAnchor.js
        arguments: { seed: "FINAL_01", totalAssets: 1500 }

    # --- STEP 3: Client Grants Access to FI2 ---
    - label: "Step-2: FI Approval"
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts: { tps: 8 } # Read-Modify-Write is heavier on CPU
      workload:
        module: workloads/approve.js
        arguments:
          seed: "FINAL_01"
          totalAssets: 1500

    # --- STEP 4: FI2 Data Retrieval ---
    - label: "Step 3: FI2 Get client data"
      txDuration: 120
      rateControl:
        type: linear-rate
        opts:
          startingTps: 10
          finishingTps: 50 # Stress test the read-only capability
      workload:
        module: workloads/getClientData.js
        arguments:
          seed: "FINAL_01"
          totalAssets: 1500
          invoker: "_Org2MSP_FI2"

    # --- STEP 5: Mixed Workload Stress Test ---
    - label: "Step 4: Mixed Stress Test"
      txNumber: 5000
      rateControl:
        type: linear-rate
        opts:
          startingTps: 10
          finishingTps: 40
      workload:
        module: workloads/mixedWorkload.js
        arguments:
          seed: "FINAL_01"
          totalAssets: 1500
          invoker: "FI1" # Use FI1 or _Org2MSP_FI2
