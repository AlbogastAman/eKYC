test:
  name: eKYC-Benchmark
  description: Full-lifecycle performance benchmark for eKYC smart contract
  
  workers:
    type: local
    number: 5

  options:
    test:
      transactionFailureThreshold: 5
    monitoring:
      type: ["docker"]
      docker:
        containers: ["all"]
      interval: 1

  rounds:
    # ---------------------------------------------------
    # Phase 0 – Dataset Preload (Consolidated for sync)
    # ---------------------------------------------------
    - label: preload-data
      description: Populate ledger with 10k credentials at a safe pace
      txNumber: 10000
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workloads/createClient.js
        arguments:
          seed: "STRESS_FEB_26" # Shared seed across all rounds
          totalAssets: 10000

    # ---------------------------------------------------
    # Phase 3 – Composite Write Performance (Approve)
    # ---------------------------------------------------
    - label: approve-write
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 40
      workload:
        module: workloads/approve.js
        arguments:
          seed: "STRESS_FEB_26"
          totalAssets: 10000

    # ---------------------------------------------------
    # Phase 4 – Read Performance (Anchor Retrieval)
    # ---------------------------------------------------
    - label: read-anchor
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 150 # Reads are faster, let's test higher TPS
      workload:
        module: workloads/readAnchor.js
        arguments:
          seed: "STRESS_FEB_26"
          totalAssets: 10000

    # ---------------------------------------------------
    # Phase 5 – Relation Query Scalability
    # ---------------------------------------------------
    - label: relation-query
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: workloads/getRelationByFi.js
        arguments:
          seed: "STRESS_FEB_26"
          totalAssets: 10000

    # ---------------------------------------------------
    # Phase 6 & 7 – Production Mix & Stress Ramp
    # ---------------------------------------------------
    - label: mixed-production-stress
      txDuration: 180
      rateControl:
        type: linear-rate
        opts:
          startingTps: 50
          finishingTps: 200 # Automatically ramps up to find the breaking point
      workload:
        module: workloads/mixedWorkload.js
        arguments:
          seed: "STRESS_FEB_26"
          totalAssets: 10000