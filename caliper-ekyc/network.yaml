name: Fabric-eKYC-Network
version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  # channelName of mychannel matches the name of the channel created by test network
  - channelName: mychannel
    # the chaincodeIDs of all the fabric chaincodes in caliper-benchmarks
    contracts:
      - id: eKYC
        version: "1.0"
        language: node
        contractID: eKYC
        organizations: 
            - Org1MSP
            - Org2MSP
            
organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: FI1
          clientPrivateKey:
            path: ../api/wallet/FI1-key.pem
          clientSignedCert:
            path: ../api/wallet/FI1-cert.pem

    connectionProfile:
      path: ../test-network/organizations/peerOrganizations/org1.example.com/connection-org1.yaml
      discover: true

  - mspid: Org2MSP
    identities:
      certificates:
        - name: FI2
          clientPrivateKey:
            path: ../api/wallet/FI2-key.pem
          clientSignedCert:
            path: ../api/wallet/FI2-cert.pem

    connectionProfile:
      path: ../test-network/organizations/peerOrganizations/org2.example.com/connection-org2.yaml
      discover: true
